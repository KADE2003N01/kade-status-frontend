services:
  - type: web
    name: my-digital-status
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kade-status-backend-1d3q.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
