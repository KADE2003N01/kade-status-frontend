<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login | Kade Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <a class="auth-back-link" href="../index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to portfolio</a>
        <section class="auth-card" aria-labelledby="login-title">
            <a class="auth-brand" href="../index.html">
                <img src="../media/bg-removed.png" alt="" class="nav-avatar">
                <span>KADE <small>PORTFOLIO</small></span>
            </a>
            <div class="auth-heading">
                <span class="auth-icon"><i class="fas fa-shield-halved" aria-hidden="true"></i></span>
                <p class="auth-eyebrow">PRIVATE WORKSPACE</p>
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in with your administrator credentials to continue.</p>
            </div>
            <form id="admin-login-form" class="auth-form">
                <label for="admin-email">Email address</label>
                <div class="auth-input-wrap"><i class="far fa-envelope" aria-hidden="true"></i><input id="admin-email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="you@example.com" required></div>
                <label for="admin-password">Password</label>
                <div class="auth-input-wrap"><i class="fas fa-key" aria-hidden="true"></i><input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="1024" placeholder="Enter your password" required><button id="password-toggle" type="button" aria-label="Show password"><i class="far fa-eye" aria-hidden="true"></i></button></div>
                <p id="login-feedback" class="auth-feedback" aria-live="polite"></p>
                <button class="auth-submit" type="submit"><span>Sign in to admin</span><i class="fas fa-arrow-right" aria-hidden="true"></i></button>
            </form>
            <p class="auth-footnote"><i class="fas fa-lock" aria-hidden="true"></i> Secure sign-in · Administrator access only</p>
        </section>
        <p class="auth-footer">© 2026 David KWIZERA · KADE PORTFOLIO</p>
    </main>
    <script src="api-config.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
